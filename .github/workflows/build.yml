name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build every step
        run: |
          fail=0
          for p in $(find . -name "*.csproj"); do
            echo "== $p"
            dotnet build "$p" -c Release 2>&1 | tee build.log || true
            # surface compiler/restore errors as annotations (readable without the full log)
            grep -E ": (error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -20 | sed 's/^/::error::/'
            grep -q "Build succeeded" build.log || fail=1
          done
          dotnet run --project 03-sloth-assistant -c Release --no-build -- selftest || fail=1
          dotnet run --project 04-skills/SkillAgent -c Release --no-build -- selftest || fail=1
          dotnet run --project 05-real-bills/BillsAgent -c Release --no-build -- selftest || fail=1
          dotnet run --project 07-fine-tuning/ReceiptBench -c Release --no-build -- selftest || fail=1
          exit $fail
      - name: Every SKILL.md header is valid YAML (strict, like OpenCode and GitHub)
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in sorted(set(glob.glob("**/SKILL.md", recursive=True) + glob.glob(".agents/**/SKILL.md", recursive=True))):
              try:
                  meta = yaml.safe_load(open(f, encoding="utf-8").read().split("---")[1])
                  assert meta.get("name") and meta.get("description"), "name and description are required"
                  print("ok  ", f)
              except Exception as e:
                  bad += 1
                  print(f"::error file={f}::Invalid SKILL.md header: {str(e).splitlines()[0]}")
          sys.exit(1 if bad else 0)
          EOF
