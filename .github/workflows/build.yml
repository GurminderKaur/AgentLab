name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build every step
        run: |
          fail=0
          for p in $(find . -name "*.csproj"); do
            echo "== $p"
            dotnet build "$p" -c Release 2>&1 | tee build.log || true
            # surface compiler/restore errors as annotations (readable without the full log)
            grep -E ": (error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -20 | sed 's/^/::error::/'
            grep -q "Build succeeded" build.log || fail=1
          done
          dotnet run --project 03-sloth-assistant -c Release --no-build -- selftest || fail=1
          exit $fail
