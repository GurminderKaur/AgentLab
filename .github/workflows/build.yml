name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Build every step
        run: for p in $(find . -name "*.csproj"); do echo "== $p"; dotnet build "$p" -c Release || exit 1; done
